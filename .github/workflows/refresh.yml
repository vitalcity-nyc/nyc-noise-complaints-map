name: Refresh noise data

on:
  schedule:
    # 09:40 UTC daily = 5:40 a.m. ET. Late enough that the previous day's 311
    # records have landed in Socrata, and it re-cuts "last Saturday night."
    - cron: '40 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install h3

      - name: Build data
        run: python3 scripts/build_data.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data scripts/.geocode_cache.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh noise data $(date -u +%Y-%m-%d)"
            git push
          fi
