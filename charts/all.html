<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New York's 311 noise complaints, three ways</title>
<meta name="description" content="Three views of New York City 311 noise complaints — by category, by time of day, and by borough — in one click-through card.">
<link rel="stylesheet" href="https://use.typekit.net/qqk2vto.css">
<style>
:root {
  --vc-black: #050507;
  --vc-white: #ffffff;
  --vc-cloud: #dddddd;
  --vc-paper: #f7f7f4;
  --vc-charcoal: #707175;
  --vc-orange: #ff7c53;
  --vc-sans: "halyard-text", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--vc-paper); font-family: var(--vc-sans); color: var(--vc-black); -webkit-font-smoothing: antialiased; }
body { padding: 28px 16px; }

.vc-card { max-width: 760px; margin: 0 auto; background: var(--vc-white); border: 1px solid var(--vc-black); }

/* Tab bar: a label, three segments, and prev/next arrows for stepping through. */
.vc-tabbar { display: flex; align-items: stretch; border-bottom: 1px solid var(--vc-black); }
.vc-tabs { display: grid; grid-template-columns: repeat(3, 1fr); flex: 1; }
.vc-tabs button {
  background: var(--vc-white); border: 0; border-right: 1px solid var(--vc-cloud);
  padding: 12px 10px; cursor: pointer; font-family: var(--vc-sans); color: var(--vc-black);
  font-size: 12px; font-weight: 700; letter-spacing: 0.01em; line-height: 1.2; text-align: center;
}
.vc-tabs button:hover:not(.is-active) { background: var(--vc-paper); }
.vc-tabs button.is-active { background: var(--vc-black); color: var(--vc-white); }
.vc-step {
  border: 0; border-left: 1px solid var(--vc-cloud); background: var(--vc-white);
  width: 42px; cursor: pointer; color: var(--vc-black); font-size: 16px; line-height: 1;
}
.vc-step:hover { background: var(--vc-paper); }
.vc-step:disabled { color: var(--vc-cloud); cursor: default; background: var(--vc-white); }

.vc-stack { position: relative; width: 100%; height: 640px; overflow: hidden; transition: height 0.25s ease; background: var(--vc-white); }
.vc-stack iframe {
  position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
  opacity: 0; visibility: hidden; transition: opacity 0.2s ease; background: var(--vc-white);
}
.vc-stack iframe.is-active { opacity: 1; visibility: visible; }

body.embed { padding: 0; background: var(--vc-white); }
body.embed .vc-card { border: 0; max-width: none; }

@media (max-width: 560px) {
  .vc-tabs button { font-size: 11px; padding: 11px 6px; }
  .vc-step { width: 36px; }
}
</style>
</head>
<body>
<div class="vc-card">
  <div class="vc-tabbar">
    <button class="vc-step" id="vc-prev" aria-label="Previous chart">&#8249;</button>
    <div class="vc-tabs" id="vc-tabs">
      <button data-i="0" class="is-active">By type</button>
      <button data-i="1">When it peaks</button>
      <button data-i="2">By borough</button>
    </div>
    <button class="vc-step" id="vc-next" aria-label="Next chart">&#8250;</button>
  </div>
  <div class="vc-stack" id="vc-stack">
    <iframe data-id="noise-by-type"    class="is-active" title="311 noise complaints by category"        src="by-type.html?embed=1"    loading="eager"></iframe>
    <iframe data-id="noise-by-time"                       title="When 311 noise complaints peak"          src="by-time.html?embed=1"    loading="eager"></iframe>
    <iframe data-id="noise-by-borough"                    title="311 noise complaints by borough"         src="by-borough.html?embed=1" loading="eager"></iframe>
  </div>
</div>

<script>
(function () {
  var IS_EMBED = new URLSearchParams(location.search).get('embed') === '1';
  if (IS_EMBED) document.body.classList.add('embed');

  var tabs = Array.prototype.slice.call(document.querySelectorAll('#vc-tabs button'));
  var frames = Array.prototype.slice.call(document.querySelectorAll('#vc-stack iframe'));
  var stack = document.getElementById('vc-stack');
  var tabbar = document.querySelector('.vc-tabbar');
  var prevBtn = document.getElementById('vc-prev');
  var nextBtn = document.getElementById('vc-next');
  var heights = {};           // child id -> last reported content height
  var active = 0;
  var DEFAULT_H = 640;

  function activeId() { return frames[active].getAttribute('data-id'); }

  function applyHeight() {
    var h = heights[activeId()] || DEFAULT_H;
    stack.style.height = h + 'px';
    postUp(h);
  }

  // Tell the host page (Ghost) how tall the whole card is: tab bar + active chart.
  function postUp(chartH) {
    if (!IS_EMBED) return;
    var total = tabbar.offsetHeight + (chartH || heights[activeId()] || DEFAULT_H);
    parent.postMessage({ type: 'vc-embed-height', id: 'noise-charts', height: Math.ceil(total) }, '*');
  }

  function setActive(i) {
    active = Math.max(0, Math.min(frames.length - 1, i));
    tabs.forEach(function (t, n) { t.classList.toggle('is-active', n === active); });
    frames.forEach(function (f, n) { f.classList.toggle('is-active', n === active); });
    prevBtn.disabled = active === 0;
    nextBtn.disabled = active === frames.length - 1;
    applyHeight();
  }

  tabs.forEach(function (t) {
    t.addEventListener('click', function () { setActive(+t.getAttribute('data-i')); });
  });
  prevBtn.addEventListener('click', function () { setActive(active - 1); });
  nextBtn.addEventListener('click', function () { setActive(active + 1); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') setActive(active - 1);
    else if (e.key === 'ArrowRight') setActive(active + 1);
  });

  // Each inner chart posts its own content height (vc-embed-height with its own id).
  // Capture them all; resize the card when the change is for the visible chart.
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'vc-embed-height' || typeof d.height !== 'number') return;
    if (d.id === 'noise-by-type' || d.id === 'noise-by-time' || d.id === 'noise-by-borough') {
      heights[d.id] = d.height;
      if (d.id === activeId()) applyHeight();
    }
  });

  window.addEventListener('resize', function () { applyHeight(); });
  setActive(0);
  // Nudge the host a few times while the inner charts load their fonts/data.
  var n = 0, t = setInterval(function () { postUp(); if (++n > 14) clearInterval(t); }, 300);
})();
</script>
</body>
</html>
